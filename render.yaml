# render.yaml — Render deployment configuration
# https://render.com/docs/render-yaml-reference
#
# IMPORTANT: Root Directory must be BLANK (empty) in the Render dashboard.
# The "src/src" double-path error is caused by Root Directory being set to "src".
#
# All BullMQ workers (scrape, dedup, startup intelligence, company news) now run
# INSIDE the web service process. No separate Render worker services are needed.

services:
  - type: web
    name: Leads-scraper-Backend
    runtime: node
    # rootDir intentionally omitted — uses repository root
    buildCommand: npm install && npx playwright install chromium
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.11.0
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"

      # ── BullMQ worker tuning ──────────────────────────────────────────────
      # Scrape worker: 1 concurrent scrape job at a time (heavy Playwright usage)
      - key: WORKER_CONCURRENCY
        value: "1"
      # Startup intelligence worker: 1 concurrent job (discovery + enrichment)
      - key: STARTUP_WORKER_CONCURRENCY
        value: "1"
      # Company news worker: 2 concurrent jobs (lightweight HTTP fetching)
      - key: NEWS_WORKER_CONCURRENCY
        value: "2"
      # How fresh startup data must be before re-enriching (hours)
      - key: STARTUP_FRESHNESS_HOURS
        value: "24"

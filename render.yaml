# render.yaml — Render deployment configuration
# https://render.com/docs/render-yaml-reference
#
# IMPORTANT: Root Directory must be BLANK (empty) in the Render dashboard.
# The "src/src" double-path error is caused by Root Directory being set to "src".

services:
  - type: web
    name: Leads-scraper-Backend
    runtime: node
    # rootDir intentionally omitted — uses repository root
    buildCommand: npm install && npx playwright install chromium
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.11.0
